<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dota Coach">
  <!-- Maskable variant: same "Ascent" mark as icon.svg, scaled into the central
       80% safe zone so a launcher can crop it to a circle or a squircle without
       clipping the target ring. The background is full-bleed for the same reason. -->
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="dc-line" x1="136" y1="376" x2="368" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ece6a"/>
      <stop offset="0.45" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#dc-bg)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="88" y="88" width="336" height="336" rx="56" fill="none" stroke="#3b4261" stroke-width="12"/>
    <path d="M136 376L216 288L272 320L335 209" fill="none" stroke="url(#dc-line)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="136" cy="376" r="26" fill="#9ece6a"/>
    <circle cx="368" cy="152" r="56" fill="none" stroke="#bb9af7" stroke-width="20"/>
    <circle cx="368" cy="152" r="22" fill="#7aa2f7"/>
  </g>
</svg>
