[package]
name = "dota-coach-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "rust_decimal",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# rustls only: the runtime image has no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
async-trait = "0.1"
futures = "0.3"
axum-extra = { version = "0.10", features = ["cookie"] }
# Cookie max-age is expressed with the `cookie` crate's clock type.
time = "0.3"
# Session tokens: CSPRNG bytes, stored as a SHA-256 hash.
rand = "0.9"
sha2 = "0.10"
# Payment-provider notifications are signed with HMAC-SHA512.
hmac = "0.12"
hex = "0.4"
# Steam returns OpenID parameters in the query string; they must be decoded
# verbatim so verification can echo them back unchanged.
form_urlencoded = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
