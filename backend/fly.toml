app = "dota-coach-backend"
primary_region = "ams"

# Fly will build straight from backend/Dockerfile - no [build] section needed
# as long as this file lives at backend/fly.toml (next to the Dockerfile).

# NOT the current deployment target. Production runs on Belmo, built from
# backend/Dockerfile with the environment described in .env.production.example.
# This file is kept only as a working Fly fallback; if you deploy it, the
# PUBLIC_BASE_URL below must be whatever origin Fly actually serves, because
# Steam signs return_to and rejects a mismatch.

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  COOKIE_SECURE = "true"
  PUBLIC_BASE_URL = "https://dota-coach-backend.fly.dev"
  FRONTEND_BASE_URL = "https://dashboard.belmo.io"
  CORS_ORIGINS = "https://dashboard.belmo.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
